# Is Argentic prod up? Runs tools/ops/watch.sh on a cron and speaks only when the state changes.
# This repo is public, so Actions minutes are free (the org's private repos are billing-blocked).
#
# Alerts, on a change only (up -> down, down -> up), never once per run:
#   - email through Resend from alerts@getargentic.com to the ALERT_TO secret, when RESEND_API_KEY and ALERT_TO are set
#   - the run fails on up -> down, so GitHub's own failure email also reaches whoever last edited this file, with no secret at all
# Optional deep check, every 6 hours: /v1/usage plus one tiny wake on a dedicated probe tenant, when ARGENTIC_PROBE_KEY and PROBE_MODEL_KEY are
# set. It has its own state, so a model outage reads as "deep down", not "site down".
# Try the mail path by hand: Actions, watch, Run workflow, test_email.
name: watch

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      deep:
        description: Also run the database checks and the wake round trip
        type: boolean
        default: false
      test_email:
        description: Send a test alert email
        type: boolean
        default: false

concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Restore the last state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: watch-state-none
          restore-keys: watch-state-

      - name: Probe
        env:
          ARGENTIC_PROBE_KEY: ${{ secrets.ARGENTIC_PROBE_KEY }}
          PROBE_MODEL_KEY: ${{ secrets.PROBE_MODEL_KEY }}
          WANT_DEEP: ${{ github.event.inputs.deep }}
        run: |
          mkdir -p out .state
          # deep on request, and on the first tick of 00, 06, 12 and 18 UTC
          if [ "$WANT_DEEP" = true ] || { [ $((10#$(date -u +%H) % 6)) -eq 0 ] && [ $((10#$(date -u +%M))) -lt 30 ]; }; then export DEEP=1; fi
          OUT_DIR=out bash tools/ops/watch.sh

      - name: Decide what changed
        id: change
        run: |
          prev_core=$(cat .state/core 2>/dev/null || echo up)
          prev_deep=$(cat .state/deep 2>/dev/null || echo up)
          core=$(cat out/core)
          deep=$(cat out/deep 2>/dev/null || echo "$prev_deep")
          alert=none
          [ "$core" != "$prev_core" ] && alert="core-$core"
          [ "$deep" != "$prev_deep" ] && alert="${alert/none/} deep-$deep"
          echo "core $prev_core -> $core, deep $prev_deep -> $deep, alert: $alert"
          echo "$core" > .state/core; echo "$deep" > .state/deep
          echo "alert=$alert" >> "$GITHUB_OUTPUT"

      - name: Save the state
        uses: actions/cache/save@v4
        with:
          path: .state
          key: watch-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Email on a change
        if: steps.change.outputs.alert != 'none' || github.event.inputs.test_email == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          ALERT: ${{ steps.change.outputs.alert }}
          TEST: ${{ github.event.inputs.test_email }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${RESEND_API_KEY:-}" ] || [ -z "${ALERT_TO:-}" ]; then echo "no RESEND_API_KEY or ALERT_TO secret: the failed run is the alert"; exit 0; fi
          if [ "$TEST" = true ]; then subject="Argentic monitor: test alert"; body="This is a test. The monitor can send mail."
          elif [[ "$ALERT" == *down* ]]; then subject="Argentic is DOWN ($ALERT)"; body="$(cat out/report.txt)"
          else subject="Argentic recovered ($ALERT)"; body="$(cat out/report.txt)"; fi
          body="$body"$'\n\n'"$RUN_URL"
          jq -n --arg to "$ALERT_TO" --arg s "$subject" --arg t "$body" \
            '{from:"Argentic Alerts <alerts@getargentic.com>", to:[$to], reply_to:"hi@getargentic.com", subject:$s, text:$t}' > mail.json
          code=$(curl -sS -m 30 -o resp.txt -w '%{http_code}' https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" -H 'Content-Type: application/json' -d @mail.json)
          echo "resend: $code"; [ "$code" = 200 ] || { cat resp.txt; exit 1; }

      # Red only on up -> down, so GitHub's failure email is one per outage, not one per run.
      - name: Fail on a new outage
        if: contains(steps.change.outputs.alert, 'down')
        run: |
          echo "::error::Argentic changed to down (${{ steps.change.outputs.alert }})"
          cat out/report.txt
          exit 1
