# Release only. Publishes a package when its version is new, with no tokens: npm and PyPI
# both trust this workflow by its repository, file name and environment, so keep the file
# name and the `npm` / `pypi` environments (see release/package-publishing.md).
#
# Three ways in, one run each:
#   - Merge to main a change to the version in adapters/typescript/package.json or
#     adapters/python/pyproject.toml. If that version has no tag yet, this publishes it,
#     then tags the commit npm-vX / py-vX. An unchanged or already tagged version does nothing.
#   - Run it by hand (Actions, release, Run workflow) and pick the package: same check.
#   - Push a tag npm-v0.1.0 / py-v0.1.0 yourself: publishes that tag, as before.
# Tags made here use GITHUB_TOKEN, which starts no new workflow run, so nothing publishes twice.
# If the GitHub org or repo is renamed, update the trusted publisher entries on npmjs.com
# and pypi.org to match.
name: release

on:
  push:
    tags:
      - 'npm-v*'
      - 'py-v*'
    branches: [main]
    paths:
      - adapters/typescript/package.json
      - adapters/python/pyproject.toml
  workflow_dispatch:
    inputs:
      package:
        description: Which package to release (its current version, if not tagged yet)
        type: choice
        options: [npm, py]

jobs:
  npm:
    if: >-
      startsWith(github.ref_name, 'npm-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.package == 'npm') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: adapters/typescript
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          v=$(node -p "require('./package.json').version")
          tag="npm-v$v"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$tag" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match package.json $v"; exit 1; }
            echo "go=1" >> "$GITHUB_OUTPUT"; echo "make_tag=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] \
             && git cat-file -e "$BEFORE" 2>/dev/null \
             && [ "$(git show "$BEFORE:adapters/typescript/package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")" = "$v" ]; then
            echo "version $v did not change in this push; nothing to release"; echo "go=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to release"; echo "go=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "releasing $v"; echo "go=1" >> "$GITHUB_OUTPUT"; echo "make_tag=1" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.go == '1'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - if: steps.plan.outputs.go == '1'
        run: npm ci
      - if: steps.plan.outputs.go == '1'
        run: npm run build
      - if: steps.plan.outputs.go == '1'
        run: npm pack --dry-run
      - if: steps.plan.outputs.go == '1'
        run: npm publish --access public --provenance
      - name: Tag the release
        if: steps.plan.outputs.go == '1' && steps.plan.outputs.make_tag == '1'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

  pypi:
    if: >-
      startsWith(github.ref_name, 'py-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.package == 'py') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decide
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          ver() { python -c "import sys,tomllib;print(tomllib.loads(sys.stdin.read())['project']['version'])"; }
          v=$(ver < adapters/python/pyproject.toml)
          tag="py-v$v"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$tag" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match pyproject $v"; exit 1; }
            echo "go=1" >> "$GITHUB_OUTPUT"; echo "make_tag=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] \
             && git cat-file -e "$BEFORE" 2>/dev/null \
             && [ "$(git show "$BEFORE:adapters/python/pyproject.toml" | ver)" = "$v" ]; then
            echo "version $v did not change in this push; nothing to release"; echo "go=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to release"; echo "go=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "releasing $v"; echo "go=1" >> "$GITHUB_OUTPUT"; echo "make_tag=1" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.go == '1'
        run: python -m pip install build
      - if: steps.plan.outputs.go == '1'
        run: python -m build adapters/python
      - if: steps.plan.outputs.go == '1'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: adapters/python/dist/
      - name: Tag the release
        if: steps.plan.outputs.go == '1' && steps.plan.outputs.make_tag == '1'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
